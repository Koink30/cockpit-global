name: Cockpit Global - build et publication
on:
  push:
    branches: [migration-cockpit-existant]
    paths: ['apps/cockpit/**', '.github/workflows/cockpit-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cockpit-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/cockpit/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/cockpit
      - run: npm test && npm run build
        working-directory: apps/cockpit
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/cockpit/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
